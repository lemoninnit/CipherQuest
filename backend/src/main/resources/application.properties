# ==============================
# CipherQuest – Application Config
# ==============================

# Server
server.port=${PORT:8080}

# Supabase PostgreSQL Database Connection (Using IPv4 Compatible Connection Pooler)
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-1-ap-southeast-1.pooler.supabase.com:6543/postgres?prepareThreshold=0}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres.jacbtscvbixzsfbkkjcf}
spring.datasource.password=${DB_PASSWORD:Lenonlee@7312005}

# JPA / Hibernate Configuration for PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT
jwt.secret=${JWT_SECRET:CipherQuestSuperSecretKey2026ShouldBeAtLeast256BitsLongForHS256Algorithm}
jwt.expiration-ms=86400000

# CORS – allowed origins (comma-separated, supports wildcard patterns)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://cipher-quest.kwpoliquit.workers.dev,*}

# Fishing game config
game.fishing.max-attempts=10
game.fishing.base-xp=100
game.fishing.streak-bonus-multiplier=1.5
